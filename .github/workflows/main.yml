name: Build Sandboxie Plus

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-x64:
    name: Build x64
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Install/verify MSVC v142
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe'
          $vswhere  = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'

          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) {
            throw 'Visual Studio installation was not found.'
          }

          Write-Host "Visual Studio: $vs"

          # GitHub's windows-2022 image contains the v142 component package,
          # but does not necessarily install it. The component group is the
          # supported way to add the complete x86/x64 v142 toolset.
          $v142 = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '14.29.*' }

          if ($v142) {
            Write-Host "v142 is already installed:"
            $v142 | ForEach-Object { Write-Host $_.FullName }
          } else {
            $log = "$env:RUNNER_TEMP\vs-v142-install.log"

            $args = @(
              'modify',
              '--installPath', $vs,
              '--add', 'Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64',
              '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL',
              '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC',
              '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.CLI.Support',
              '--quiet',
              '--norestart',
              '--nocache',
              '--log', $log
            )

            Write-Host 'Installing MSVC v142...'
            $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
            Write-Host "VS Installer exit code: $($p.ExitCode)"

            if ($p.ExitCode -ne 0) {
              if (Test-Path $log) {
                Write-Host '--- Visual Studio Installer log ---'
                Get-Content $log -Tail 200
              }
              throw "Visual Studio v142 installation failed with exit code $($p.ExitCode)."
            }
          }

          # Verify after installation. Do not rely on the installer exit code alone.
          $v142 = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '14.29.*' }

          if (-not $v142) {
            throw "MSVC v142 was not found in $vs\VC\Tools\MSVC after installation."
          }

          $v142 | ForEach-Object {
            Write-Host "Confirmed v142: $($_.FullName)"
          }

      - name: Load build variables
        shell: cmd
        run: |
          call Installer\buildVariables.cmd build_qt6
          echo qt_version=%qt_version%>>%GITHUB_ENV%
          echo qt6_version=%qt6_version%>>%GITHUB_ENV%

      - name: Build Sandboxie x86
        shell: cmd
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration=SbieRelease /p:Platform=Win32 -maxcpucount:8

      - name: Build Sandboxie x64
        shell: cmd
        run: msbuild /t:build Sandboxie\Sandbox.sln /p:Configuration=SbieRelease /p:Platform=x64 -maxcpucount:8

      - name: Build Sandboxie x64 driver
        shell: cmd
        run: msbuild /t:build Sandboxie\SandboxDrv.sln /p:Configuration=SbieRelease /p:Platform=x64 -maxcpucount:8

      - name: Install Qt
        shell: cmd
        run: SandboxiePlus\install_qt.cmd x64

      - name: Install jom
        shell: cmd
        run: SandboxiePlus\install_jom.cmd

      - name: Build Sandboxie Plus
        shell: cmd
        run: SandboxiePlus\qmake_plus.cmd x64 build_qt6

      - name: Locate Sandboxie Plus binaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Searching for SandMan.exe...'

          $candidates = @(
            'SandboxiePlus\Bin\x64\Release\SandMan.exe',
            'SandboxiePlus\bin\x64\Release\SandMan.exe',
            'SandboxiePlus\Bin\x64\release\SandMan.exe',
            'SandboxiePlus\bin\x64\release\SandMan.exe',
            'SandboxiePlus\SandMan\x64\Release\SandMan.exe'
          )

          $sandman = $null
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $sandman = (Resolve-Path $candidate).Path
              break
            }
          }

          if (-not $sandman) {
            $found = Get-ChildItem -Path SandboxiePlus -Filter SandMan.exe -Recurse -File -ErrorAction SilentlyContinue
            if ($found) {
              $sandman = $found[0].FullName
            }
          }

          if (-not $sandman) {
            Write-Host 'SandMan.exe was not found. SandboxiePlus directory:'
            Get-ChildItem SandboxiePlus -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -First 300 FullName
            throw 'SandMan.exe was not produced by the Sandboxie Plus build.'
          }

          Write-Host "Found SandMan.exe: $sandman"
          "SANDBOXIE_SANDMAN=$sandman" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Prepare Sandboxie Plus output
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $destination = Join-Path $PWD 'Installer\SbiePlus_x64'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          $sandman = $env:SANDBOXIE_SANDMAN
          if (-not (Test-Path $sandman)) {
            throw "SandMan.exe disappeared: $sandman"
          }

          Copy-Item $sandman (Join-Path $destination 'SandMan.exe') -Force
          Write-Host "Copied SandMan.exe to $destination"

          # Keep the original repository packaging step as the primary
          # packaging mechanism; this only guarantees that the main GUI
          # executable exists at the expected artifact location.
          Write-Host 'Installer output before copy_build:'
          Get-ChildItem $destination -File -ErrorAction SilentlyContinue |
            Select-Object Name, Length

      - name: Build SbieShell
        shell: cmd
        run: msbuild /t:restore,build -p:RestorePackagesConfig=true SandboxiePlus\SbieShell\SbieShell.sln /p:Configuration=Release /p:Platform=x64

      - name: Build Sandboxie Tools
        shell: cmd
        run: msbuild /t:build SandboxieTools\SandboxieTools.sln /p:Configuration=Release /p:Platform=x64 -maxcpucount:8

      - name: Prepare runtime files
        shell: cmd
        run: |
          Installer\fix_qt5_languages.cmd x64 build_qt6
          Installer\get_openssl.cmd
          Installer\get_7zip.cmd
          Installer\copy_build.cmd x64 build_qt6

      - name: Verify build output
        shell: powershell
        run: |
          $required = @(
            'Installer\SbiePlus_x64\SandMan.exe',
            'Installer\SbiePlus_x64\SbieDrv.sys',
            'Installer\SbiePlus_x64\SbieDll.dll',
            'Installer\SbiePlus_x64\SbieSvc.exe'
          )

          $missing = @()
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              $missing += $file
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host 'Installer output directory:'
            Get-ChildItem 'Installer\SbiePlus_x64' -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object FullName, Length
            throw "Missing build output: $($missing -join ', ')"
          }

          Write-Host 'All required build outputs are present.'

      - name: Upload x64 build
        uses: actions/upload-artifact@v7
        with:
          name: Sandboxie-Plus-x64
          path: Installer\SbiePlus_x64
          if-no-files-found: error
          retention-days: 14
