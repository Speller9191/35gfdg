name: Build Sandboxie Plus

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-x64:
    name: Build x64
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # windows-2022 has Visual Studio 2022, but some v142 libraries used by
      # SbieShell are not installed by default. GitHub's runner-images issue
      # tracker documents that the VS installer sometimes needs to be invoked
      # twice for these components.
      - name: Install missing VS v142 components
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe'
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'

          if (-not (Test-Path $installer)) {
            throw "Visual Studio Installer was not found: $installer"
          }

          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) {
            throw "Could not find a Visual Studio installation."
          }

          Write-Host "Visual Studio installation: $vs"

          $components = @(
            'Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64',
            'Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL',
            'Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC',
            'Microsoft.VisualStudio.Component.VC.14.29.16.11.CLI.Support'
          )

          $arguments = @(
            'modify',
            '--installPath', $vs
          )

          foreach ($component in $components) {
            $arguments += '--add'
            $arguments += $component
          }

          $arguments += '--quiet'
          $arguments += '--norestart'
          $arguments += '--nocache'

          Write-Host "Installing v142 components..."
          Write-Host "$installer $($arguments -join ' ')"

          # The VS installer on hosted runners has been observed to return
          # exit code 1 on the first invocation while the components are still
          # being staged. Invoking the same command a second time completes it.
          $exitCodes = @()
          for ($i = 1; $i -le 2; $i++) {
            Write-Host "VS Installer pass $i/2"
            $p = Start-Process -FilePath $installer `
              -ArgumentList $arguments `
              -Wait -PassThru -WindowStyle Hidden
            $exitCodes += $p.ExitCode
            Write-Host "VS Installer exit code: $($p.ExitCode)"
          }

          if (($exitCodes | Where-Object { $_ -eq 0 }).Count -eq 0) {
            throw "Visual Studio component installation failed. Exit codes: $($exitCodes -join ', ')"
          }

      - name: Verify v142 toolset
        shell: powershell
        run: |
          $vcRoot = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC'
          $toolsets = Get-ChildItem $vcRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '14.29.*' }

          if (-not $toolsets) {
            throw "MSVC v142 (14.29.x) was not found under $vcRoot"
          }

          $toolsets | ForEach-Object { Write-Host "Found v142: $($_.FullName)" }

      - name: Load build variables
        shell: cmd
        run: |
          call Installer\buildVariables.cmd build_qt6
          echo qt_version=%qt_version%>>%GITHUB_ENV%
          echo qt6_version=%qt6_version%>>%GITHUB_ENV%

      - name: Build Sandboxie x86
        shell: cmd
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration=SbieRelease /p:Platform=Win32 -maxcpucount:8

      - name: Build Sandboxie x64
        shell: cmd
        run: msbuild /t:build Sandboxie\Sandbox.sln /p:Configuration=SbieRelease /p:Platform=x64 -maxcpucount:8

      - name: Build Sandboxie x64 driver
        shell: cmd
        run: msbuild /t:build Sandboxie\SandboxDrv.sln /p:Configuration=SbieRelease /p:Platform=x64 -maxcpucount:8

      - name: Install Qt
        shell: cmd
        run: SandboxiePlus\install_qt.cmd x64

      - name: Install jom
        shell: cmd
        run: SandboxiePlus\install_jom.cmd

      - name: Build Sandboxie Plus
        shell: cmd
        run: SandboxiePlus\qmake_plus.cmd x64 build_qt6

      - name: Build SbieShell
        shell: cmd
        run: msbuild /t:restore,build -p:RestorePackagesConfig=true SandboxiePlus\SbieShell\SbieShell.sln /p:Configuration=Release /p:Platform=x64

      - name: Build Sandboxie Tools
        shell: cmd
        run: msbuild /t:build SandboxieTools\SandboxieTools.sln /p:Configuration=Release /p:Platform=x64 -maxcpucount:8

      - name: Prepare runtime files
        shell: cmd
        run: |
          Installer\fix_qt5_languages.cmd x64 build_qt6
          Installer\get_openssl.cmd
          Installer\get_7zip.cmd
          Installer\copy_build.cmd x64 build_qt6

      - name: Verify build output
        shell: powershell
        run: |
          $required = @(
            'Installer\SbiePlus_x64\SandMan.exe',
            'Installer\SbiePlus_x64\SbieDrv.sys',
            'Installer\SbiePlus_x64\SbieDll.dll',
            'Installer\SbiePlus_x64\SbieSvc.exe'
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing build output: $file"
            }
          }

      - name: Upload x64 build
        uses: actions/upload-artifact@v7
        with:
          name: Sandboxie-Plus-x64
          path: Installer\SbiePlus_x64
          if-no-files-found: error
          retention-days: 14
